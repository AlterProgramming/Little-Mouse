name: Validate browser-capture capacities

on:
  pull_request:
    paths:
      - 'capabilities/**'
      - 'docs/**'
      - 'tools/**'
      - 'tests/**'
      - 'README.md'
      - '.github/workflows/validate-browser-capture-capacities.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Validate capability registry JSON
        run: python -m json.tool capabilities/registry.json >/dev/null
