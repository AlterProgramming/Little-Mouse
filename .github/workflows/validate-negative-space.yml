name: Validate negative-space workflows

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/**'
      - 'docs/**'
      - 'README.md'
      - '.github/workflows/validate-negative-space.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
